<!doctype html>
<html lang="he-IL" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="12wyapp" />
    <title>12wyapp</title>
    <script>
      // Applies the saved language before first paint. Without this, the page would be laid
      // out for the wrong language for a frame before React corrects it.
      //
      // Only an explicit saved choice is honoured; everyone else gets Hebrew. The browser's
      // own language list is deliberately ignored, exactly as `resolveInitialLocale()` does —
      // if the two disagreed, the pre-paint direction would fight the one React then applies.
      (function () {
        try {
          var stored = localStorage.getItem('12wy.locale.v2');
          var locale = stored === 'he' || stored === 'en' ? stored : 'he';
          document.documentElement.lang = locale === 'he' ? 'he-IL' : 'en';
          document.documentElement.dir = locale === 'he' ? 'rtl' : 'ltr';
        } catch (err) {
          /* Blocked storage just means we keep the Hebrew default already in the markup. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
